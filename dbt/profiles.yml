ai_weather:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('AI_WEATHER_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('AI_WEATHER_SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('AI_WEATHER_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('AI_WEATHER_SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('AI_WEATHER_SNOWFLAKE_WAREHOUSE') }}"
      database: AI_DWH
      schema: WEATHER_STAGING
      threads: 1
