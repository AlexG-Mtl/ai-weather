[project]
name = "ai-weather"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "snowflake-connector-python>=3.12,<5",
]

[project.scripts]
ai-weather = "ai_weather.cli:main"
ai-weather-dbt = "ai_weather.dbt_cli:main"

[dependency-groups]
dev = [
  "dbt-snowflake>=1.9,<2",
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
